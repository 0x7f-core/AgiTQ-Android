name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Gradle environment
        working-directory: android
        run: gradle --version

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK output
        working-directory: android
        run: |
          ls -lah app/build/outputs/apk/release/
          test -n "$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AgiTQ-Android-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
