name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AGITQ_KEYSTORE_BASE64: ${{ secrets.AGITQ_KEYSTORE_BASE64 }}
      AGITQ_KEYSTORE_PASSWORD: ${{ secrets.AGITQ_KEYSTORE_PASSWORD }}
      AGITQ_KEY_ALIAS: ${{ secrets.AGITQ_KEY_ALIAS }}
      AGITQ_KEY_PASSWORD: ${{ secrets.AGITQ_KEY_PASSWORD }}
      AGITQ_KEYSTORE_PATH: agitq-release.p12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v4.12 refresh button patch once
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          widget = Path('android/app/src/main/java/com/agitq/android/AgiTQWidget.kt')
          s = widget.read_text(encoding='utf-8')
          if 'val refreshButtonSize = when {' not in s:
              old = '''    Box(
        modifier = GlanceModifier.fillMaxSize(),
        contentAlignment = Alignment.BottomEnd
    ) {
        Image(
            provider = ImageProvider(bitmap),
            contentDescription = description,
            modifier = GlanceModifier
                .fillMaxSize()
                .clickable(actionStartActivity(dashboardIntent(context))),
            contentScale = ContentScale.FillBounds
        )

        Image(
            provider = ImageProvider(R.drawable.ic_widget_refresh),
            contentDescription = "새로고침",
            modifier = GlanceModifier
                .size(42.dp)
                .padding(8.dp)
                .clickable(
                    actionRunCallback<RefreshWidgetAction>(
                        actionParametersOf(RefreshKindKey to kind.name)
                    )
                )
        )
    }
'''
              new = '''    val minSideDp = min(glanceSize.width.value, glanceSize.height.value)
    val refreshButtonSize = when {
        minSideDp < 110f -> 44.dp
        minSideDp < 160f -> 50.dp
        else -> 54.dp
    }

    Box(
        modifier = GlanceModifier.fillMaxSize(),
        contentAlignment = Alignment.BottomEnd
    ) {
        Image(
            provider = ImageProvider(bitmap),
            contentDescription = description,
            modifier = GlanceModifier
                .fillMaxSize()
                .clickable(actionStartActivity(dashboardIntent(context))),
            contentScale = ContentScale.FillBounds
        )

        Image(
            provider = ImageProvider(R.drawable.ic_widget_refresh),
            contentDescription = "새로고침",
            modifier = GlanceModifier
                .size(refreshButtonSize)
                .padding(2.dp)
                .clickable(
                    actionRunCallback<RefreshWidgetAction>(
                        actionParametersOf(RefreshKindKey to kind.name)
                    )
                )
        )
    }
'''
              if old not in s:
                  raise SystemExit('refresh button marker not found')
              s = s.replace(old, new, 1)
              widget.write_text(s, encoding='utf-8')

          drawable = Path('android/app/src/main/res/drawable/ic_widget_refresh.xml')
          drawable.write_text('''<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="24dp"
    android:height="24dp"
    android:viewportWidth="24"
    android:viewportHeight="24">
    <path
        android:fillColor="#F21D1D1F"
        android:strokeColor="#70FFFFFF"
        android:strokeWidth="1"
        android:pathData="M12,0.9a11.1,11.1 0,1 0,0 22.2a11.1,11.1 0,1 0,0 -22.2" />
    <path
        android:fillColor="#00000000"
        android:strokeColor="#1FFFFFFF"
        android:strokeWidth="0.7"
        android:pathData="M12,2.7a9.3,9.3 0,1 0,0 18.6a9.3,9.3 0,1 0,0 -18.6" />
    <path
        android:fillColor="#D8FFFFFF"
        android:pathData="M17.65,6.35C16.2,4.9 14.21,4 12,4c-4.09,0 -7.19,3.72 -6.39,7.69L3,9v7h7l-2.76,-2.76C6.37,10.41 8.36,8 12,8c2.21,0 4,1.79 4,4s-1.79,4 -4,4c-1.82,0 -3.33,-1.22 -3.82,-2.88l-3.05,0.8C5.99,17.87 8.65,20 12,20c4.42,0 8,-3.58 8,-8 0,-2.21 -0.9,-4.21 -2.35,-5.65z" />
</vector>
''', encoding='utf-8')

          gradle = Path('android/app/build.gradle.kts')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace('versionCode = 12', 'versionCode = 13')
          g = g.replace('versionName = "4.11"', 'versionName = "4.12"')
          gradle.write_text(g, encoding='utf-8')
          PY

      - name: Commit v4.12 source patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to patch"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/app/src/main/java/com/agitq/android/AgiTQWidget.kt \
                    android/app/src/main/res/drawable/ic_widget_refresh.xml \
                    android/app/build.gradle.kts
            git commit -m "Match Scriptable refresh button styling"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Gradle environment
        working-directory: android
        run: gradle --version

      - name: Prepare signing keystore
        working-directory: android
        run: |
          printf '%s' "$AGITQ_KEYSTORE_BASE64" | base64 --decode > app/agitq-release.p12
          test -s app/agitq-release.p12
          chmod 600 app/agitq-release.p12

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK output
        working-directory: android
        run: |
          ls -lah app/build/outputs/apk/release/
          test -n "$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AgiTQ-Android-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
