name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AGITQ_KEYSTORE_BASE64: ${{ secrets.AGITQ_KEYSTORE_BASE64 }}
      AGITQ_KEYSTORE_PASSWORD: ${{ secrets.AGITQ_KEYSTORE_PASSWORD }}
      AGITQ_KEY_ALIAS: ${{ secrets.AGITQ_KEY_ALIAS }}
      AGITQ_KEY_PASSWORD: ${{ secrets.AGITQ_KEY_PASSWORD }}
      AGITQ_KEYSTORE_PATH: agitq-release.p12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Gradle environment
        working-directory: android
        run: gradle --version

      - name: Prepare signing keystore
        working-directory: android
        run: |
          printf '%s' "$AGITQ_KEYSTORE_BASE64" | base64 --decode > app/agitq-release.p12
          test -s app/agitq-release.p12
          chmod 600 app/agitq-release.p12

      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < cloudflare/worker.js
          node --check web/js/api.js
          node --check web/js/app.js
          node --test cloudflare/worker.test.js

      - name: Test, lint, and build release APK
        working-directory: android
        run: gradle testReleaseUnitTest lintRelease assembleRelease --no-daemon --stacktrace

      - name: Verify APK output
        working-directory: android
        run: |
          ls -lah app/build/outputs/apk/release/
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -p "$apk" classes.dex | strings > "$RUNNER_TEMP/agitq-dex-strings.txt"
          for widget in SpxWidget QqqWidget FgiWidget; do
            grep -q "Lcom/agitq/android/${widget};" "$RUNNER_TEMP/agitq-dex-strings.txt"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AgiTQ-Android-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
