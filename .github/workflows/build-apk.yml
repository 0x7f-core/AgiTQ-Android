name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AGITQ_KEYSTORE_BASE64: ${{ secrets.AGITQ_KEYSTORE_BASE64 }}
      AGITQ_KEYSTORE_PASSWORD: ${{ secrets.AGITQ_KEYSTORE_PASSWORD }}
      AGITQ_KEY_ALIAS: ${{ secrets.AGITQ_KEY_ALIAS }}
      AGITQ_KEY_PASSWORD: ${{ secrets.AGITQ_KEY_PASSWORD }}
      AGITQ_KEYSTORE_PATH: agitq-release.p12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v4.10 source patch
        run: python3 tools/patch_v410.py

      - name: Commit v4.10 source patch
        run: |
          if git diff --quiet; then
            echo "Source already patched"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/app/src/main/java/com/agitq/android/AgiTQWidget.kt android/app/src/main/res/drawable/ic_widget_refresh.xml android/app/build.gradle.kts web/index.html web/style.css web/js/app.js
            git commit -m "Add manual refresh controls and KST 기준 label"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Gradle environment
        working-directory: android
        run: gradle --version

      - name: Prepare signing keystore
        working-directory: android
        run: |
          printf '%s' "$AGITQ_KEYSTORE_BASE64" | base64 --decode > app/agitq-release.p12
          test -s app/agitq-release.p12
          chmod 600 app/agitq-release.p12

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK output
        working-directory: android
        run: |
          ls -lah app/build/outputs/apk/release/
          test -n "$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AgiTQ-Android-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
