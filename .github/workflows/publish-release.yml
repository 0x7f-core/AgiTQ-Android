name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AGITQ_KEYSTORE_BASE64: ${{ secrets.AGITQ_KEYSTORE_BASE64 }}
      AGITQ_KEYSTORE_PASSWORD: ${{ secrets.AGITQ_KEYSTORE_PASSWORD }}
      AGITQ_KEY_ALIAS: ${{ secrets.AGITQ_KEY_ALIAS }}
      AGITQ_KEY_PASSWORD: ${{ secrets.AGITQ_KEY_PASSWORD }}
      AGITQ_KEYSTORE_PATH: agitq-release.p12
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Verify tag matches Android version
        run: |
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)"
          test "${GITHUB_REF_NAME}" = "v${version_name}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare signing keystore
        working-directory: android
        run: |
          printf '%s' "$AGITQ_KEYSTORE_BASE64" | base64 --decode > app/agitq-release.p12
          test -s app/agitq-release.p12
          chmod 600 app/agitq-release.p12

      - name: Check web and Worker regressions
        run: |
          node --input-type=module --check < cloudflare/worker.js
          node --check web/js/api.js
          node --check web/js/app.js
          node --test cloudflare/worker.test.js

      - name: Test and build signed release APK
        working-directory: android
        run: gradle testReleaseUnitTest lintRelease assembleRelease --no-daemon --stacktrace

      - name: Verify widget classes
        run: |
          unzip -p android/app/build/outputs/apk/release/app-release.apk classes.dex | strings > "$RUNNER_TEMP/agitq-dex-strings.txt"
          for widget in SpxWidget QqqWidget FgiWidget; do
            grep -q "Lcom/agitq/android/${widget};" "$RUNNER_TEMP/agitq-dex-strings.txt"
          done

      - name: Package release files
        run: |
          apk_name="AgiTQ-Android-${GITHUB_REF_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk_name"
          sha256sum "$apk_name" > "${apk_name}.sha256"

      - name: Publish release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "AgiTQ-Android-${GITHUB_REF_NAME}.apk" \
            "AgiTQ-Android-${GITHUB_REF_NAME}.apk.sha256" \
            --verify-tag \
            --title "AgiTQ Android ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
